[package]
name = "pomobar"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "A lightweight focus timer for Windows that shows the time left on your taskbar."
authors = ["Williams Automation"]
license = "MIT"
repository = "https://github.com/GlenDubb/pomobar"
readme = "README.md"
keywords = ["focus", "timer", "windows", "productivity", "taskbar"]
categories = ["gui"]
publish = false

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
